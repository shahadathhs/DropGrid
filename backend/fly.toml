# Fly.io config. Pick your own app name and region (`fly launch --no-deploy --copy-config`
# will offer to change them). Secrets are NOT stored here: set them with `fly secrets set`
# (DATABASE_URL, JWT_SECRET, CONTACT_EMAIL). See docs/DEPLOY.md.
app = "dropgrid-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  DEBUG = "false"
  PORT = "8000"

[deploy]
  # Runs in a temporary machine before the new version goes live; a failure aborts the deploy.
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  # Keep this at 1. Rate limits live in process memory, so a second machine would
  # double the limits and split their counters. Do not scale out without moving
  # the limiter to a shared store.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
