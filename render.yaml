# Render Blueprint for the DropGrid API. Create it with: Render dashboard > New > Blueprint,
# pick this repo. Secrets are NOT stored here: DATABASE_URL and CONTACT_EMAIL are asked for
# on first deploy, and JWT_SECRET is generated by Render. See docs/DEPLOY.md.
services:
  - type: web
    name: dropgrid-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Migrations run on every start. That is safe with one instance (alembic upgrade head
    # does nothing when the database is current) and works on the free plan, which has
    # no pre-deploy command. Render sets $PORT.
    dockerCommand: sh -c "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    # Keep this at one instance. Rate limits live in process memory, so a second instance
    # would double the limits and split their counters. Do not scale out without moving the
    # limiter to a shared store.
    plan: free
    region: singapore # pick one near your players, and put the Neon database in the same area
    healthCheckPath: /health
    # Only redeploy when the backend changes, not on game or docs commits.
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
