# Monorepo services: headless Godot for the game in game/, FastAPI backend in backend/.
# Compose builds both images on first use.
services:
  godot:
    build:
      context: .
      args:
        GODOT_VERSION: ${GODOT_VERSION:-4.7.2}
    image: dropgrid-godot:${GODOT_VERSION:-4.7.2}
    platform: linux/amd64
    working_dir: /project
    environment:
      - GODOT_VERSION=${GODOT_VERSION:-4.7.2}
      # Optional: a fixed debug key for signing (CI sets it; see docs/CI.md).
      - ANDROID_DEBUG_KEYSTORE_BASE64
      # Where Godot finds the debug key. docker/android-setup.sh creates it there if missing.
      # (Godot 4.7 ignores the editor_settings-4.tres file that script also writes.)
      - GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/root/.android/debug.keystore
      - GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
      - GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
    volumes:
      - ./game:/project
      # Persist editor settings and the debug keystore between runs.
      - godot-config:/root/.config/godot
      - android-keys:/root/.android
      - ./docker/android-setup.sh:/usr/local/bin/android-setup:ro

  # Local Postgres for development. Production uses Neon: set DATABASE_URL to the
  # Neon URL in backend/.env (see backend/.env.example) and skip this service.
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=dropgrid
      - POSTGRES_PASSWORD=dropgrid
      - POSTGRES_DB=dropgrid
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropgrid -d dropgrid"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DEBUG=${BACKEND_DEBUG:-true}
      - DATABASE_URL=${DATABASE_URL:-postgresql://dropgrid:dropgrid@db:5432/dropgrid}

volumes:
  godot-config:
  android-keys:
  pgdata:
