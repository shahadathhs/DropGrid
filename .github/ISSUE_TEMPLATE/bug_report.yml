name: Bug report
description: Something in the game or the backend does not work as documented.
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Game (Godot client)
        - Backend (FastAPI)
        - Sync between the two
        - CI / tooling / docs
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead? Include exact steps to reproduce.
      placeholder: |
        1. Start a game at level 3
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: For game bugs — device or OS, build source (CI artifact, release, local), screen size. For backend bugs — Python version and how you ran it.
      placeholder: Pixel 7a, Android 15, dropgrid-0.1.0-ab12cd3.apk
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Console output, adb logcat lines, or screenshots. Screenshots of UI bugs are required — describe what is wrong in each.
  - type: checkboxes
    id: scope
    attributes:
      label: Checks
      options:
        - label: This is a bug, not a feature request
        - label: I checked that this is not already reported
