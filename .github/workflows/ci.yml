# Quality gates: tests and checks. Packaging, backend deploy, and releases
# live in cd.yml, which runs after this workflow succeeds on main or a tag.
# APK artifact setup (signing key, server URL): docs/CI.md.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  game-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Lint GDScript (gdlint + format check)
        run: make lint
      # The same commands as local development (Makefile): headless Godot in Docker.
      - name: Check the project loads
        run: make check
      - name: Run game tests
        run: make test

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run pyright
      - name: Test
        run: uv run pytest -q
