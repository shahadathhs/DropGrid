# One pipeline. PRs and every push run the quality gates; pushes to main
# continue through the Render deploy, an APK build, and the rolling "latest"
# release; a version bump (make release v=X.Y.Z) publishes DropGrid vX.Y.Z;
# v* tags also produce official releases. All of it shows as check status on
# the commit. Secrets and variables: docs/CI.md.
name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  game-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Lint GDScript (gdlint + format check)
        run: make lint
      # The same commands as local development (Makefile): headless Godot in Docker.
      - name: Check the project loads
        run: make check
      - name: Run game tests
        run: make test

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run pyright
      - name: Test
        run: uv run pytest -q

  site:
    name: Site (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from the root package.json packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # pnpm workspace: one install covers the root tooling and site/.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --dir site lint
      - name: Type-check
        run: pnpm --dir site typecheck
      - name: Build
        run: pnpm --dir site build

  deploy-render:
    name: Deploy backend (Render)
    needs: [game-tests, backend-tests]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the deploy and wait for it to go live
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set: backend not deployed. The URL is in Render > your service > Settings > Deploy Hook (docs/CI.md)."
            exit 0
          fi
          SERVICE_ID=$(echo "$HOOK_URL" | sed -E 's|.*/deploy/(srv-[A-Za-z0-9]+).*|\1|')
          DEPLOY_ID=$(curl -sS -X POST "$HOOK_URL" | jq -r '.deploy.id // empty')
          if [ -z "$DEPLOY_ID" ]; then
            echo "::warning::Render did not return a deploy id; continuing without waiting."
            exit 0
          fi
          echo "Deploy ${DEPLOY_ID} started on ${SERVICE_ID}."
          if [ -z "$API_KEY" ]; then
            echo "::warning::RENDER_API_KEY is not set: cannot verify the deploy. Create an API key in Render > Account Settings (docs/CI.md)."
            exit 0
          fi
          # Poll until the deploy is live (~10 min budget).
          for _ in $(seq 1 40); do
            STATUS=$(curl -sS -H "Authorization: Bearer $API_KEY" \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys/${DEPLOY_ID}" \
              | jq -r '.status // empty')
            echo "status: ${STATUS:-unknown}"
            case "$STATUS" in
              live) exit 0 ;;
              build_failed|pre_deploy_failed|update_failed|deploy_failed|canceled|deactivated)
                echo "::error::Render deploy ${DEPLOY_ID} reported '${STATUS}'."
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for the Render deploy."
          exit 1

  apk:
    name: Build APK
    needs: [game-tests, backend-tests, deploy-render]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.ver.outputs.is-release }}
      version: ${{ steps.ver.outputs.version }}
    env:
      # Repository variable, e.g. https://dropgrid-api.onrender.com/v1 (optional).
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      # Repository secret: base64 of a fixed debug keystore (optional, see docs/CI.md).
      ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      # A main push becomes a versioned release when the VERSION file names a
      # version that has no release yet (the bump script wrote it); otherwise
      # the build is a plain rolling build.
      - name: Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "is-release=true" >> "$GITHUB_OUTPUT"
          else
            FILE_VERSION=$(cat VERSION)
            if gh release view "v${FILE_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              VERSION="0.1.0-${GITHUB_SHA::7}"
              echo "is-release=false" >> "$GITHUB_OUTPUT"
            else
              VERSION="${FILE_VERSION}"
              echo "is-release=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Set server URL
        run: |
          # Each build gets a higher version code, so a newer APK installs over an older one.
          sed -i "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" game/export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"${VERSION}\"|" game/export_presets.cfg

          if [ -n "${API_BASE_URL}" ]; then
            case "${API_BASE_URL}" in
              https://*/v1) ;;
              *) echo "API_BASE_URL must be https://.../v1 (got: ${API_BASE_URL})" >&2; exit 1 ;;
            esac
            sed -i "s|^network/api_base_url=.*|network/api_base_url=\"${API_BASE_URL}\"|" game/project.godot
            sed -i "s|^network/api_base_url.release=.*|network/api_base_url.release=\"${API_BASE_URL}\"|" game/project.godot
          else
            echo "::warning::API_BASE_URL is not set: this APK points at localhost, so accounts and the leaderboard will not work on a phone."
          fi
          if [ -z "${ANDROID_DEBUG_KEYSTORE_BASE64}" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set: this APK is signed with a one-off key and cannot be installed over a previous build."
          fi

      - name: Build the APK
        run: make apk

      - name: Name the file
        run: mv game/build/dropgrid-debug.apk "game/build/dropgrid-${VERSION}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: dropgrid-apk
          path: game/build/dropgrid-*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dropgrid-apk

      # Rolling dev channel: refreshed on every main push. Never claims the
      # "latest" flag — that belongs to versioned releases.
      - name: Refresh the rolling latest build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes || true
          gh release create latest dropgrid-*.apk --repo "${GITHUB_REPOSITORY}" \
            --title "Latest build (main@${GITHUB_SHA::7})" \
            --notes "Automatic build of commit ${GITHUB_SHA}. This is a rolling dev channel, not a versioned release — expect rough edges. Get versioned releases from the releases page." \
            --latest=false

      # Fires when the VERSION file names a version without a release yet
      # (the bump script wrote it), or when a v* tag was pushed.
      - name: Create the versioned release
        if: needs.apk.outputs.is-release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          gh release create "v${VERSION}" dropgrid-*.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "DropGrid v${VERSION}" \
            --generate-notes --latest
